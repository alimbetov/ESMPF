spring:
  datasource:
    url: ${ESMPF_DB_URL:jdbc:postgresql://localhost:5432/esmpf}
    username: ${ESMPF_DB_USERNAME:esmpf}
    password: ${ESMPF_DB_PASSWORD:esmpf}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.sql
