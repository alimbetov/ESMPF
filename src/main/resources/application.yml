spring:
  datasource:
    url: jdbc:h2:mem:esmpf;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200

esmpf:
  security:
    google:
      enabled: false

server:
  error:
    include-message: never
