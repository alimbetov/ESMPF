spring:
  datasource:
    url: jdbc:h2:mem:esmpf;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: false
  servlet:
    multipart:
      max-file-size: ${ESMPF_STORAGE_MAX_FILE_SIZE:100MB}
      max-request-size: ${ESMPF_STORAGE_MAX_REQUEST_SIZE:101MB}
      file-size-threshold: 0
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200

esmpf:
  security:
    jwt:
      enabled: ${ESMPF_JWT_ENABLED:false}
      issuer: ${ESMPF_JWT_ISSUER:esmpf}
      audience: ${ESMPF_JWT_AUDIENCE:esmpf-api}
      secret: ${ESMPF_JWT_SECRET:}
      access-token-ttl: ${ESMPF_JWT_ACCESS_TOKEN_TTL:PT15M}
      clock-skew: ${ESMPF_JWT_CLOCK_SKEW:PT30S}
    google:
      enabled: false
  storage:
    file:
      max-size: ${ESMPF_STORAGE_MAX_BYTES:104857600}
    local:
      root: ${ESMPF_STORAGE_ROOT:./var/storage}
      temp-directory: ${ESMPF_STORAGE_TEMP:./var/storage/.tmp}

server:
  error:
    include-message: never
