name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Fast H2 tests
        shell: bash
        run: |
          set -o pipefail
          mvn --batch-mode -Dtest='!*PostgresPersistenceIntegrationTests' test 2>&1 | tee fast-tests.log
      - name: Upload fast-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-tests-log
          path: fast-tests.log
          if-no-files-found: error
          retention-days: 7

  postgres-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: PostgreSQL Testcontainers verification
        shell: bash
        run: |
          set -o pipefail
          mvn --batch-mode --update-snapshots verify 2>&1 | tee postgres-verify.log
      - name: Upload PostgreSQL verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-verify-log
          path: postgres-verify.log
          if-no-files-found: error
          retention-days: 7
