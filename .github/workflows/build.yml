name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          mvn --batch-mode --update-snapshots verify 2>&1 | tee maven-verify.log
      - name: Upload Maven verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-verify-log
          path: maven-verify.log
          if-no-files-found: error
          retention-days: 7
