name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Fast H2 tests
        shell: bash
        run: |
          set -o pipefail
          mvn --batch-mode --update-snapshots \
            -Dtest='!*PostgresPersistenceIntegrationTests' test \
            2>&1 | tee maven-fast-test.log
      - name: Upload fast-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-fast-test-log
          path: maven-fast-test.log
          if-no-files-found: error
          retention-days: 7

  postgres-proof:
    needs: fast-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Full verification with PostgreSQL Testcontainers
        shell: bash
        run: |
          set -o pipefail
          mvn --batch-mode --update-snapshots verify 2>&1 | tee maven-verify.log
      - name: Upload Maven verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-verify-log
          path: maven-verify.log
          if-no-files-found: error
          retention-days: 7
